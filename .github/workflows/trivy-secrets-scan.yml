name: "[security] 🔒 Trivy secrets scan"

on:
  push:
    branches:
      - dev
      - test
      - main
  pull_request:
  workflow_dispatch:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get date for cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.70.0

      - name: Run Trivy secrets scan
        run: |
          trivy fs \
            --scanners=secret \
            --skip-dirs=.venv \
            --skip-dirs=.git \
            --timeout=120s \
            --no-progress \
            --exit-code=1 \
            .
