name: "[security] 🔒 Trivy secrets scan"

on:
  push:
    branches:
      - dev
      - test
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run Trivy secrets scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          skip-dirs: .venv,.git
          timeout: 120s
          hide-progress: true
          version: v0.70.0
