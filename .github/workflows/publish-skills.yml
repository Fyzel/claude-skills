name: Package and Publish Skills

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

jobs:
  publish-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Package and publish skills
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          trap 'rm -f *.skill' EXIT
          failed=0

          for dir in skills/*/; do
            skill_name="${dir#skills/}"
            skill_name="${skill_name%/}"

            if [ ! -f "skills/${skill_name}/SKILL.md" ]; then
              echo "Skipping ${skill_name}: no SKILL.md"
              continue
            fi

            latest_tag=$(git tag --list "${skill_name}-v*" --sort=-version:refname | head -1)
            if [ -n "${latest_tag}" ]; then
              latest_num="${latest_tag##*-v}"
              skill_version=$((latest_num + 1))
            else
              skill_version=1
            fi
            tag="${skill_name}-v${skill_version}"

            echo "Processing: ${skill_name} → ${tag}"

            if gh release view "${tag}" > /dev/null 2>&1; then
              echo "Release ${tag} already exists, skipping"
              continue
            fi

            if [ -n "${latest_tag}" ]; then
              commit_range="${latest_tag}..HEAD"
            else
              commit_range="HEAD"
            fi
            changes=$(git log --pretty=format:"- %s (%h)" ${commit_range} -- "skills/${skill_name}/")
            if [ -z "${changes}" ]; then
              changes="- No changes recorded"
            fi
            notes=$(printf 'Packaged from commit %s (run %s)\n\n## Changes\n%s' \
              "${SHORT_SHA}" "${GITHUB_RUN_NUMBER}" "${changes}")

            asset="${skill_name}.skill"
            if ! (cd "skills/${skill_name}" && zip -r "../../${asset}" .); then
              echo "::error::Failed to zip ${skill_name}" >&2
              failed=1
              continue
            fi

            if gh release create "${tag}" \
              --title "${skill_name} v${skill_version}" \
              --notes "${notes}" \
              --target "${GITHUB_SHA}" \
              --latest=false \
              "${asset}"; then
              echo "Published: ${tag}"
            else
              echo "::error::Failed to publish ${skill_name}" >&2
              failed=1
            fi
          done

          [ "$failed" -eq 0 ] || exit 1
