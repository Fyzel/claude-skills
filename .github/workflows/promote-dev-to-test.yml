name: "[chore] 🚀 Promote dev to test"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create promotion pull request
        run: |
          gh pr create \
            --base test \
            --head dev \
            --title "Promotion: 🚀 dev → test" \
            --body "Automated promotion of the dev branch to test." \
            --assignee ${{ vars.PROMOTION_ASSIGNEE }} \
          || echo "PR already exists or no diff between branches, skipping"

#      - name: Push dev to test
#        run: git push origin refs/heads/dev:refs/heads/test --force
