name: Publish Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Build and publish wiki
        run: |
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          if ! git clone "${wiki_url}" wiki 2>/dev/null; then
            mkdir wiki
            cd wiki
            git init
            git remote add origin "${wiki_url}"
            cd ..
          fi

          # Reads a frontmatter scalar. Handles inline values and YAML
          # folded/literal block scalars (`key: >` / `key: |`), joining the
          # block's indented lines into a single line.
          get_frontmatter() {
            local file="$1" key="$2"
            awk -v key="$key" '
              NR==1 && $0!="---" {exit}
              /^---$/ {fm++; if (fm==2) exit; next}
              fm==1 && $0 ~ "^" key ":" {
                val=$0; sub("^" key ":[[:space:]]*","",val)
                if (val ~ /^[>|][+-]?$/ || val=="") {
                  block=""
                  while ((getline line) > 0) {
                    if (line ~ /^---$/ || line ~ /^[^[:space:]]/) break
                    gsub(/^[[:space:]]+/,"",line)
                    block=(block=="" ? line : block " " line)
                  }
                  print block
                } else {
                  print val
                }
                exit
              }
            ' "${file}"
          }

          strip_frontmatter() {
            awk 'NR==1 && /^---$/{fm=1;next} fm && /^---$/{fm=0;next} !fm' "$1"
          }

          # Build Home page
          home="wiki/Home.md"
          {
            echo "# Skills"
            echo ""
            echo "| Skill | Description |"
            echo "|---|---|"
          } > "${home}"

          install_cmds=""
          for dir in skills/*/; do
            skill_name="${dir#skills/}"
            skill_name="${skill_name%/}"
            skill_file="skills/${skill_name}/SKILL.md"

            [ -f "${skill_file}" ] || continue

            display=$(get_frontmatter "${skill_file}" "name")
            description=$(get_frontmatter "${skill_file}" "description")

            echo "| [${display}](${skill_name}) | ${description} |" >> "${home}"
            install_cmds="${install_cmds}/plugin install ${skill_name}@claude-skills"$'\n'

            # Build per-skill page
            skill_page="wiki/${skill_name}.md"
            {
              strip_frontmatter "${skill_file}"

              refs_dir="skills/${skill_name}/references"
              if [ -d "${refs_dir}" ]; then
                echo ""
                echo "---"
                echo ""
                echo "## Reference Files"
                echo ""
                for ref in "${refs_dir}"/*.md; do
                  [ -f "${ref}" ] || continue
                  ref_name=$(basename "${ref}" .md)
                  echo "### ${ref_name}"
                  echo ""
                  cat "${ref}"
                  echo ""
                done
              fi
            } > "${skill_page}"
          done

          # Append marketplace install instructions and license to Home
          {
            echo ""
            echo "## Install as plugins"
            echo ""
            echo "This repository is a [Claude Code plugin marketplace](https://code.claude.com/docs/en/plugin-marketplaces). Each skill is published as its own plugin, so you can install only the ones you want."
            echo ""
            echo '```sh'
            echo "# Register the marketplace (one time)"
            echo "/plugin marketplace add Fyzel/claude-skills"
            echo ""
            echo "# Install individual skills"
            printf '%s' "${install_cmds}"
            echo ""
            echo "# Refresh after the marketplace updates"
            echo "/plugin marketplace update claude-skills"
            echo '```'
            echo ""
            echo "## License"
            echo ""
            echo "Licensed under the [Apache License, Version 2.0](https://github.com/Fyzel/claude-skills/blob/main/LICENSE). Copyright 2026 Michael R. Schwab."
          } >> "${home}"

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No wiki changes to publish"
          else
            git commit -m "Update wiki from ${GITHUB_SHA::7}"
            git push origin HEAD:master
          fi
