name: Publish Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and publish wiki
        run: |
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          if ! git clone "${wiki_url}" wiki 2>/dev/null; then
            mkdir wiki
            cd wiki
            git init
            git remote add origin "${wiki_url}"
            cd ..
          fi

          get_frontmatter() {
            local file="$1" key="$2"
            sed -n "1{/^---$/!q};/^---$/,/^---$/p" "${file}" \
              | grep "^${key}:" | head -1 | sed "s/^${key}: *//"
          }

          strip_frontmatter() {
            awk 'NR==1 && /^---$/{fm=1;next} fm && /^---$/{fm=0;next} !fm' "$1"
          }

          # Build Home page
          home="wiki/Home.md"
          {
            echo "# Skills"
            echo ""
            echo "| Skill | Description |"
            echo "|---|---|"
          } > "${home}"

          for dir in skills/*/; do
            skill_name="${dir#skills/}"
            skill_name="${skill_name%/}"
            skill_file="skills/${skill_name}/SKILL.md"

            [ -f "${skill_file}" ] || continue

            display=$(get_frontmatter "${skill_file}" "name")
            description=$(get_frontmatter "${skill_file}" "description")

            echo "| [${display}](${display}) | ${description} |" >> "${home}"

            # Build per-skill page
            skill_page="wiki/${display}.md"
            {
              strip_frontmatter "${skill_file}"

              refs_dir="skills/${skill_name}/references"
              if [ -d "${refs_dir}" ]; then
                echo ""
                echo "---"
                echo ""
                echo "## Reference Files"
                echo ""
                for ref in "${refs_dir}"/*.md; do
                  [ -f "${ref}" ] || continue
                  ref_name=$(basename "${ref}" .md)
                  echo "### ${ref_name}"
                  echo ""
                  cat "${ref}"
                  echo ""
                done
              fi
            } > "${skill_page}"
          done

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No wiki changes to publish"
          else
            git commit -m "Update wiki from ${GITHUB_SHA::7}"
            git push origin HEAD:master
          fi
